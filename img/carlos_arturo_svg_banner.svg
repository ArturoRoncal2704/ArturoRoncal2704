<svg width="1200" height="450" viewBox="0 0 1200 450" xmlns="http://www.w3.org/2000/svg">
  <title>Carlos Arturo — Backend Developer &amp; QA Engineer</title>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="55%" stop-color="#101B2E"/>
      <stop offset="100%" stop-color="#0A1420"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1C2A42"/>
    </pattern>
    <clipPath id="panelClip">
      <rect x="60" y="110" width="360" height="260" rx="16"/>
    </clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="450" fill="url(#bgGrad)"/>
  <rect width="1200" height="450" fill="url(#dots)" opacity="0.55"/>

  <!-- microservices node-graph motif, kept to quiet top margin -->
  <g stroke="#3FD9C7" stroke-width="1" opacity="0.16">
    <line x1="70" y1="30" x2="180" y2="18"/>
    <line x1="180" y1="18" x2="280" y2="34"/>
    <line x1="280" y1="34" x2="400" y2="20"/>
    <line x1="680" y1="22" x2="790" y2="36"/>
    <line x1="790" y1="36" x2="900" y2="18"/>
    <line x1="960" y1="24" x2="1050" y2="14"/>
  </g>
  <g fill="#4FD1C5" opacity="0.4">
    <circle cx="70" cy="30" r="2.5"/><circle cx="180" cy="18" r="2.5"/><circle cx="280" cy="34" r="2.5"/><circle cx="400" cy="20" r="2.5"/>
    <circle cx="680" cy="22" r="2.5"/><circle cx="790" cy="36" r="2.5"/><circle cx="900" cy="18" r="2.5"/>
    <circle cx="960" cy="24" r="2.5"/><circle cx="1050" cy="14" r="2.5"/>
  </g>

  <!-- top-right status tag -->
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#7C8AA5">
    <circle cx="1053" cy="30" r="3.5" fill="#4FD1C5"/>
    <text x="1066" y="35">Lima, Perú</text>
  </g>

  <!-- terminal panel -->
  <g clip-path="url(#panelClip)">
    <rect x="60" y="110" width="360" height="260" fill="#0D1420"/>
    <rect x="60" y="110" width="360" height="40" fill="#101B2E"/>
  </g>
  <rect x="60" y="110" width="360" height="260" rx="16" fill="none" stroke="#22314A" stroke-width="1.5"/>
  <circle cx="82" cy="130" r="6" fill="#FF5F56"/>
  <circle cx="104" cy="130" r="6" fill="#FFBD2E"/>
  <circle cx="126" cy="130" r="6" fill="#27C93F"/>
  <text x="400" y="134" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#5B6B85">role.sh</text>

  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="18">
    <g opacity="0">
      <text x="82" y="175"><tspan fill="#4FD1C5">$</tspan><tspan fill="#C7D2E3"> whoami</tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.3s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="82" y="207" fill="#7C8AA5">carlos_arturo</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.3s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="82" y="239"><tspan fill="#4FD1C5">$</tspan><tspan fill="#C7D2E3"> role --current</tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.3s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="82" y="271" fill="#F5A623">backend_dev &amp;&amp; qa_automation</text>
      <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.3s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="82" y="303"><tspan fill="#4FD1C5">$</tspan><tspan fill="#C7D2E3"> </tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.2s" fill="freeze"/>
    </g>
  </g>
  <rect x="98" y="290" width="11" height="18" fill="#4FD1C5" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.5;0.51;1" begin="2.4s" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- name with soft glow -->
  <text x="460" y="200" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="74" font-weight="800"
        letter-spacing="0.5" fill="#4FD1C5" opacity="0.35" filter="url(#glow)">Carlos Arturo</text>
  <text x="460" y="200" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="74" font-weight="800"
        letter-spacing="0.5" fill="#EAF0F9">Carlos Arturo</text>

  <line x1="460" y1="222" x2="850" y2="222" stroke="#4FD1C5" stroke-width="5" stroke-linecap="round" stroke-dasharray="390" stroke-dashoffset="390">
    <animate attributeName="stroke-dashoffset" from="390" to="0" begin="0.3s" dur="1s" fill="freeze"/>
  </line>
  <text x="460" y="262" font-family="'Segoe UI', Arial, sans-serif" font-size="27" font-weight="500" fill="#9FB3CE">Backend Developer · QA Engineer</text>

  <!-- tag chips with per-tech accent dots -->
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="16" fill="#B9C6DC">
    <g opacity="0">
      <rect x="460" y="296" width="92" height="36" rx="18" fill="#16233A" stroke="#2A3B57"/>
      <circle cx="481" cy="314" r="5" fill="#F5A623"/>
      <text x="516" y="320" text-anchor="middle">Java</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.4s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="564" y="296" width="160" height="36" rx="18" fill="#16233A" stroke="#2A3B57"/>
      <circle cx="585" cy="314" r="5" fill="#6DB33F"/>
      <text x="654" y="320" text-anchor="middle">Spring Boot</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.55s" dur="0.4s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="736" y="296" width="100" height="36" rx="18" fill="#16233A" stroke="#2A3B57"/>
      <circle cx="757" cy="314" r="5" fill="#C7D2E3"/>
      <text x="792" y="320" text-anchor="middle">Kafka</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.4s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="848" y="296" width="130" height="36" rx="18" fill="#16233A" stroke="#2A3B57"/>
      <circle cx="869" cy="314" r="5" fill="#4FD1C5"/>
      <text x="920" y="320" text-anchor="middle">Selenium</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.85s" dur="0.4s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="990" y="296" width="115" height="36" rx="18" fill="#16233A" stroke="#2A3B57"/>
      <circle cx="1011" cy="314" r="5" fill="#2496ED"/>
      <text x="1058" y="320" text-anchor="middle">Docker</text>
      <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.4s" fill="freeze"/>
    </g>
  </g>

  <!-- CI/QA pipeline signature -->
  <line x1="460" y1="385" x2="1140" y2="385" stroke="#22314A" stroke-width="4" stroke-linecap="round"/>
  <line x1="460" y1="385" x2="1140" y2="385" stroke="#4FD1C5" stroke-width="4" stroke-linecap="round"
        stroke-dasharray="680" stroke-dashoffset="680">
    <animate attributeName="stroke-dashoffset"
             values="680;680;340;340;0;0;680"
             keyTimes="0;0.05;0.24;0.38;0.58;0.85;1"
             dur="6s" repeatCount="indefinite"/>
  </line>

  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="15" fill="#7C8AA5" text-anchor="middle">
    <text x="460" y="412">BUILD</text>
    <text x="800" y="412">TEST</text>
    <text x="1140" y="412">DEPLOY</text>
  </g>

  <circle cx="460" cy="385" r="12" fill="#3A4A63">
    <animate attributeName="fill" values="#3A4A63;#F5A623;#4FD1C5;#4FD1C5;#3A4A63"
             keyTimes="0;0.05;0.17;0.85;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="460" y="390" text-anchor="middle" font-size="13" fill="#0A0E17" font-weight="700" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.16;0.17;0.85;0.86" dur="6s" repeatCount="indefinite"/>✓
  </text>

  <circle cx="800" cy="385" r="12" fill="#3A4A63">
    <animate attributeName="fill" values="#3A4A63;#3A4A63;#F5A623;#4FD1C5;#4FD1C5;#3A4A63"
             keyTimes="0;0.21;0.24;0.38;0.85;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="800" y="390" text-anchor="middle" font-size="13" fill="#0A0E17" font-weight="700" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.37;0.38;0.85;0.86" dur="6s" repeatCount="indefinite"/>✓
  </text>

  <!-- deploy node with finishing pulse -->
  <circle cx="1140" cy="385" r="12" fill="none" stroke="#4FD1C5" stroke-width="2" opacity="0">
    <animate attributeName="r" values="12;12;30" keyTimes="0;0.58;0.78" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.58;0.78" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1140" cy="385" r="12" fill="#3A4A63">
    <animate attributeName="fill" values="#3A4A63;#3A4A63;#F5A623;#4FD1C5;#4FD1C5;#3A4A63"
             keyTimes="0;0.54;0.58;0.67;0.85;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="1140" y="390" text-anchor="middle" font-size="13" fill="#0A0E17" font-weight="700" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.67;0.85;0.86" dur="6s" repeatCount="indefinite"/>✓
  </text>

  <!-- footer handle -->
  <text x="60" y="430" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" fill="#4A5C78">github.com/ArturoRoncal2704</text>
</svg>
