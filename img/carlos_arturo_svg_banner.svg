<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <title>Carlos Arturo — Backend Developer &amp; QA Engineer</title>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="55%" stop-color="#101B2E"/>
      <stop offset="100%" stop-color="#0A1420"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1C2A42"/>
    </pattern>
    <clipPath id="panelClip">
      <rect x="48" y="76" width="330" height="220" rx="14"/>
    </clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#dots)" opacity="0.55"/>

  <!-- microservices node-graph motif, kept to quiet top margin -->
  <g stroke="#3FD9C7" stroke-width="1" opacity="0.16">
    <line x1="60" y1="26" x2="160" y2="16"/>
    <line x1="160" y1="16" x2="250" y2="30"/>
    <line x1="250" y1="30" x2="360" y2="18"/>
    <line x1="620" y1="20" x2="720" y2="32"/>
    <line x1="720" y1="32" x2="820" y2="16"/>
    <line x1="880" y1="22" x2="960" y2="14"/>
  </g>
  <g fill="#4FD1C5" opacity="0.4">
    <circle cx="60" cy="26" r="2"/><circle cx="160" cy="16" r="2"/><circle cx="250" cy="30" r="2"/><circle cx="360" cy="18" r="2"/>
    <circle cx="620" cy="20" r="2"/><circle cx="720" cy="32" r="2"/><circle cx="820" cy="16" r="2"/>
    <circle cx="880" cy="22" r="2"/><circle cx="960" cy="14" r="2"/>
  </g>

  <!-- top-right status tag -->
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#7C8AA5">
    <circle cx="1057" cy="28" r="3" fill="#4FD1C5"/>
    <text x="1068" y="32">Lima, Perú</text>
  </g>

  <!-- terminal panel -->
  <g clip-path="url(#panelClip)">
    <rect x="48" y="76" width="330" height="220" fill="#0D1420"/>
    <rect x="48" y="76" width="330" height="34" fill="#101B2E"/>
  </g>
  <rect x="48" y="76" width="330" height="220" rx="14" fill="none" stroke="#22314A" stroke-width="1.5"/>
  <circle cx="68" cy="93" r="5" fill="#FF5F56"/>
  <circle cx="88" cy="93" r="5" fill="#FFBD2E"/>
  <circle cx="108" cy="93" r="5" fill="#27C93F"/>
  <text x="360" y="97" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#5B6B85">role.sh</text>

  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="16">
    <g opacity="0">
      <text x="68" y="130"><tspan fill="#4FD1C5">$</tspan><tspan fill="#C7D2E3"> whoami</tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.3s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="68" y="158" fill="#7C8AA5">carlos_arturo</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.3s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="68" y="186"><tspan fill="#4FD1C5">$</tspan><tspan fill="#C7D2E3"> role --current</tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.3s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="68" y="214" fill="#F5A623">backend_dev &amp;&amp; qa_automation</text>
      <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.3s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="68" y="242"><tspan fill="#4FD1C5">$</tspan><tspan fill="#C7D2E3"> </tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.2s" fill="freeze"/>
    </g>
  </g>
  <rect x="83" y="230" width="9" height="15" fill="#4FD1C5" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.5;0.51;1" begin="2.4s" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- name with soft glow -->
  <text x="430" y="150" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="800"
        letter-spacing="0.5" fill="#4FD1C5" opacity="0.35" filter="url(#glow)">Carlos Arturo</text>
  <text x="430" y="150" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="800"
        letter-spacing="0.5" fill="#EAF0F9">Carlos Arturo</text>

  <line x1="430" y1="166" x2="790" y2="166" stroke="#4FD1C5" stroke-width="4" stroke-linecap="round" stroke-dasharray="360" stroke-dashoffset="360">
    <animate attributeName="stroke-dashoffset" from="360" to="0" begin="0.3s" dur="1s" fill="freeze"/>
  </line>
  <text x="430" y="202" font-family="'Segoe UI', Arial, sans-serif" font-size="23" font-weight="500" fill="#9FB3CE">Backend Developer · QA Engineer</text>

  <!-- tag chips with per-tech accent dots -->
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="14" fill="#B9C6DC">
    <g opacity="0">
      <rect x="430" y="228" width="78" height="30" rx="15" fill="#16233A" stroke="#2A3B57"/>
      <circle cx="447" cy="243" r="4" fill="#F5A623"/>
      <text x="474" y="248" text-anchor="middle">Java</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.4s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="518" y="228" width="136" height="30" rx="15" fill="#16233A" stroke="#2A3B57"/>
      <circle cx="535" cy="243" r="4" fill="#6DB33F"/>
      <text x="596" y="248" text-anchor="middle">Spring Boot</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.55s" dur="0.4s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="664" y="228" width="86" height="30" rx="15" fill="#16233A" stroke="#2A3B57"/>
      <circle cx="681" cy="243" r="4" fill="#C7D2E3"/>
      <text x="710" y="248" text-anchor="middle">Kafka</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.4s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="760" y="228" width="112" height="30" rx="15" fill="#16233A" stroke="#2A3B57"/>
      <circle cx="777" cy="243" r="4" fill="#4FD1C5"/>
      <text x="820" y="248" text-anchor="middle">Selenium</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.85s" dur="0.4s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="882" y="228" width="98" height="30" rx="15" fill="#16233A" stroke="#2A3B57"/>
      <circle cx="899" cy="243" r="4" fill="#2496ED"/>
      <text x="936" y="248" text-anchor="middle">Docker</text>
      <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.4s" fill="freeze"/>
    </g>
  </g>

  <!-- CI/QA pipeline signature -->
  <line x1="430" y1="308" x2="1140" y2="308" stroke="#22314A" stroke-width="3" stroke-linecap="round"/>
  <line x1="430" y1="308" x2="1140" y2="308" stroke="#4FD1C5" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="710" stroke-dashoffset="710">
    <animate attributeName="stroke-dashoffset"
             values="710;710;355;355;0;0;710"
             keyTimes="0;0.05;0.24;0.38;0.58;0.85;1"
             dur="6s" repeatCount="indefinite"/>
  </line>

  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#7C8AA5" text-anchor="middle">
    <text x="430" y="332">BUILD</text>
    <text x="785" y="332">TEST</text>
    <text x="1140" y="332">DEPLOY</text>
  </g>

  <circle cx="430" cy="308" r="10" fill="#3A4A63">
    <animate attributeName="fill" values="#3A4A63;#F5A623;#4FD1C5;#4FD1C5;#3A4A63"
             keyTimes="0;0.05;0.17;0.85;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="430" y="312" text-anchor="middle" font-size="11" fill="#0A0E17" font-weight="700" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.16;0.17;0.85;0.86" dur="6s" repeatCount="indefinite"/>✓
  </text>

  <circle cx="785" cy="308" r="10" fill="#3A4A63">
    <animate attributeName="fill" values="#3A4A63;#3A4A63;#F5A623;#4FD1C5;#4FD1C5;#3A4A63"
             keyTimes="0;0.21;0.24;0.38;0.85;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="785" y="312" text-anchor="middle" font-size="11" fill="#0A0E17" font-weight="700" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.37;0.38;0.85;0.86" dur="6s" repeatCount="indefinite"/>✓
  </text>

  <!-- deploy node with finishing pulse -->
  <circle cx="1140" cy="308" r="10" fill="none" stroke="#4FD1C5" stroke-width="2" opacity="0">
    <animate attributeName="r" values="10;10;26" keyTimes="0;0.58;0.78" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.58;0.78" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1140" cy="308" r="10" fill="#3A4A63">
    <animate attributeName="fill" values="#3A4A63;#3A4A63;#F5A623;#4FD1C5;#4FD1C5;#3A4A63"
             keyTimes="0;0.54;0.58;0.67;0.85;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="1140" y="312" text-anchor="middle" font-size="11" fill="#0A0E17" font-weight="700" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.67;0.85;0.86" dur="6s" repeatCount="indefinite"/>✓
  </text>

  <!-- footer handle -->
  <text x="60" y="345" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#4A5C78">github.com/ArturoRoncal2704</text>
</svg>
